# 戰情儀表板 nginx（骨架，infra-agent 定契約；web-agent/T11 可擴充靜態服務設定）
# 契約：同源反代 /api → api:8000，前端免處理 CORS。
server {
    listen 80;
    server_name _;

    # React 靜態檔（web-agent 於 T11 將 build 產物放到 /usr/share/nginx/html）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # 反向代理到唯讀 API（同源，免 CORS）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
